<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACH File Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen py-8 px-4">
    <div class="max-w-7xl mx-auto relative">
        <!-- Main Content (Centered) -->
        <div class="max-w-4xl mx-auto">
            <div class="bg-white rounded-lg shadow-xl p-8 fade-in">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">ACH & Wire File Converter</h1>
            <p class="text-gray-600 mb-6">Convert NACHA ACH TXT files or Wire TXT files to CSV format for bank import</p>
            
            <div class="space-y-6">
                <!-- File Upload Section -->
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-blue-400 transition-colors">
                    <input type="file" id="fileInput" accept=".txt" class="hidden">
                    <label for="fileInput" class="cursor-pointer">
                        <svg class="mx-auto h-12 w-12 text-gray-400 mb-4" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                            <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <p class="text-lg font-medium text-gray-700 mb-2">Click to upload ACH or Wire TXT file</p>
                        <p class="text-sm text-gray-500" id="fileName">No file selected</p>
                    </label>
                </div>

                <!-- Convert Button -->
                <button id="convertBtn" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed shadow-md hover:shadow-lg transform hover:scale-[1.02] transition-transform"
                        disabled>
                    Convert to CSV
                </button>

                <!-- Status Message -->
                <div id="statusMessage" class="hidden p-4 rounded-lg"></div>

                <!-- Wire Payment Summary (for copy/paste) -->
                <div id="wireSummary" class="hidden bg-blue-50 border-2 border-blue-200 rounded-lg p-6">
                    <h3 class="text-lg font-semibold text-blue-900 mb-4">Wire Payment Summary</h3>
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-blue-800 font-medium">Number of Recipients:</span>
                            <div class="flex items-center gap-2">
                                <span id="recipientCount" class="text-blue-900 font-bold text-xl"></span>
                                <button id="copyRecipientCountBtn" class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm font-medium transition-colors" title="Copy number">
                                    Copy
                                </button>
                            </div>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-blue-800 font-medium">Total Amount:</span>
                            <div class="flex items-center gap-2">
                                <span id="totalAmount" class="text-blue-900 font-bold text-xl"></span>
                                <button id="copyTotalAmountBtn" class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm font-medium transition-colors" title="Copy amount">
                                    Copy
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Download Button -->
                <button id="downloadBtn" 
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors hidden shadow-md hover:shadow-lg transform hover:scale-[1.02] transition-transform">
                    Download CSV File
                </button>
            </div>
        </div>
        </div>

        <!-- Client Info Sidebar (Fixed Right) -->
        <div class="absolute top-0 -right-16 w-64">
            <div class="bg-white rounded-lg shadow-xl p-4 fade-in sticky top-4">
                <h2 class="text-lg font-bold text-gray-800 mb-3">Client Information</h2>
                <div id="clientInfoList" class="space-y-1.5 max-h-[calc(100vh-200px)] overflow-y-auto">
                    <p class="text-gray-500 text-xs text-center py-4">No data available. Convert a file to see client information.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let csvData = null;
        let csvFileName = '';

        // File input handler
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('fileName').textContent = file.name;
                document.getElementById('convertBtn').disabled = false;
                document.getElementById('statusMessage').classList.add('hidden');
                document.getElementById('downloadBtn').classList.add('hidden');
                document.getElementById('wireSummary').classList.add('hidden');
                
                // Clear client info when new file is selected
                const clientInfoListEl = document.getElementById('clientInfoList');
                clientInfoListEl.innerHTML = '<p class="text-gray-500 text-sm text-center py-8">No data available. Convert a Wire file to see client information.</p>';
            }
        });

        // Convert button handler
        document.getElementById('convertBtn').addEventListener('click', async function() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                showStatus('Please select a file first.', 'error');
                return;
            }

            try {
                const text = await file.text();
                const fileName = file.name.toUpperCase();
                
                // Detect file type based on filename
                let fileType = '';
                if (fileName.startsWith('ACH_')) {
                    fileType = 'ACH';
                    const achResult = convertACHToCSV(text);
                    csvData = achResult.csv;
                    csvFileName = file.name.replace('.txt', '.csv');
                    const rowCount = achResult.csv.split('\n').length - 1; // Subtract 1 for header row
                    
                    // Display client information in sidebar
                    displayClientInfo(achResult.clientInfo);
                    
                    showStatus(`Successfully converted ACH file! Found ${rowCount} recipient(s).`, 'success');
                } else if (fileName.startsWith('WIRE_')) {
                    fileType = 'WIRE';
                    const wireResult = await convertWireToCSV(text);
                    csvData = wireResult.csv;
                    csvFileName = file.name.replace('.txt', '.csv');
                    
                    // Display summary for wire payments
                    displayWireSummary(wireResult.summary);
                    
                    // Display client information in sidebar
                    displayClientInfo(wireResult.clientInfo);
                    
                    showStatus(`Successfully converted Wire file! Found ${wireResult.summary.recipientCount} payment(s).`, 'success');
                } else {
                    throw new Error('File name must start with ACH_ or WIRE_');
                }
                
                document.getElementById('downloadBtn').classList.remove('hidden');
            } catch (error) {
                showStatus('Error converting file: ' + error.message, 'error');
                console.error(error);
            }
        });

        // Download button handler
        document.getElementById('downloadBtn').addEventListener('click', function() {
            if (!csvData) return;
            
            const blob = new Blob([csvData], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.setAttribute('href', url);
            link.setAttribute('download', csvFileName);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // Show status message
        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = `p-4 rounded-lg ${type === 'success' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`;
            statusDiv.classList.remove('hidden');
        }

        // Display client information in sidebar
        function displayClientInfo(clientInfoList) {
            const clientInfoListEl = document.getElementById('clientInfoList');
            
            if (!clientInfoList || clientInfoList.length === 0) {
                clientInfoListEl.innerHTML = '<p class="text-gray-500 text-xs text-center py-4">No client information available.</p>';
                return;
            }
            
            // Clear existing content
            clientInfoListEl.innerHTML = '';
            
            // Create client info items (single line format: Client - Amount)
            clientInfoList.forEach((client, index) => {
                const clientItem = document.createElement('div');
                clientItem.className = 'text-xs text-gray-700 py-1.5 px-2 bg-gray-50 rounded hover:bg-gray-100 transition-colors';
                
                const formattedAmount = formatNumberWithCommas(client.amount.toFixed(2));
                const clientName = client.clientName || 'N/A';
                
                clientItem.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <span class="font-medium text-gray-800 truncate flex-1" title="${clientName}">${clientName}</span>
                        <span class="text-blue-600 font-semibold whitespace-nowrap">$${formattedAmount}</span>
                    </div>
                `;
                
                clientInfoListEl.appendChild(clientItem);
            });
        }

        // Display wire payment summary
        function displayWireSummary(summary) {
            const summaryDiv = document.getElementById('wireSummary');
            const recipientCountEl = document.getElementById('recipientCount');
            const totalAmountEl = document.getElementById('totalAmount');
            
            // Format total amount with commas and 2 decimal places
            const formattedTotal = formatNumberWithCommas(summary.totalAmount.toFixed(2));
            
            // Update display
            recipientCountEl.textContent = summary.recipientCount;
            totalAmountEl.textContent = `$${formattedTotal}`;
            
            // Store values as data attributes for copying
            recipientCountEl.setAttribute('data-value', summary.recipientCount);
            totalAmountEl.setAttribute('data-value', formattedTotal);
            
            // Show summary section
            summaryDiv.classList.remove('hidden');
        }

        // Copy recipient count button handler
        document.getElementById('copyRecipientCountBtn').addEventListener('click', async function() {
            const recipientCountEl = document.getElementById('recipientCount');
            const valueToCopy = recipientCountEl.getAttribute('data-value') || recipientCountEl.textContent;
            const btn = document.getElementById('copyRecipientCountBtn');
            const originalText = btn.textContent;
            
            try {
                // Use modern Clipboard API if available
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(valueToCopy);
                } else {
                    // Fallback for older browsers
                    const tempInput = document.createElement('input');
                    tempInput.value = valueToCopy;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    document.execCommand('copy');
                    document.body.removeChild(tempInput);
                }
                
                // Show success feedback
                btn.textContent = 'Copied!';
                btn.classList.add('bg-green-600', 'hover:bg-green-700');
                btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('bg-green-600', 'hover:bg-green-700');
                    btn.classList.add('bg-blue-600', 'hover:bg-blue-700');
                }, 2000);
            } catch (err) {
                console.error('Failed to copy:', err);
                alert('Failed to copy. Please select and copy manually.');
            }
        });

        // Copy total amount button handler
        document.getElementById('copyTotalAmountBtn').addEventListener('click', async function() {
            const totalAmountEl = document.getElementById('totalAmount');
            const valueToCopy = totalAmountEl.getAttribute('data-value') || totalAmountEl.textContent.replace('$', '');
            const btn = document.getElementById('copyTotalAmountBtn');
            const originalText = btn.textContent;
            
            try {
                // Use modern Clipboard API if available
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(valueToCopy);
                } else {
                    // Fallback for older browsers
                    const tempInput = document.createElement('input');
                    tempInput.value = valueToCopy;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    document.execCommand('copy');
                    document.body.removeChild(tempInput);
                }
                
                // Show success feedback
                btn.textContent = 'Copied!';
                btn.classList.add('bg-green-600', 'hover:bg-green-700');
                btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('bg-green-600', 'hover:bg-green-700');
                    btn.classList.add('bg-blue-600', 'hover:bg-blue-700');
                }, 2000);
            } catch (err) {
                console.error('Failed to copy:', err);
                alert('Failed to copy. Please select and copy manually.');
            }
        });

        // Escape CSV field - wraps in quotes if needed and escapes internal quotes
        function escapeCSVField(field, forceText = false) {
            if (field === null || field === undefined) {
                return '';
            }
            
            const str = String(field);
            
            // If field is empty, return empty string
            if (str === '') {
                return '';
            }
            
            // If forceText is true (for numeric fields that need leading zeros), always wrap in quotes
            // Also wrap if field contains comma, quote, or newline
            if (forceText || str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
                // Escape internal quotes by doubling them
                const escaped = str.replace(/"/g, '""');
                
                // For forceText fields (like routing numbers, account numbers), add a tab character
                // at the beginning to force Excel to treat it as text and preserve leading zeros
                if (forceText) {
                    return `"\t${escaped}"`;
                }
                
                return `"${escaped}"`;
            }
            
            return str;
        }

        // Convert ACH TXT to CSV
        function convertACHToCSV(achText) {
            const lines = achText.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            
            if (lines.length < 3) {
                throw new Error('File must have at least 3 lines');
            }

            // Extract date from batch header (line 2, positions 63-68: YYMMDD)
            const batchHeader = lines[1];
            if (batchHeader.length < 68) {
                throw new Error('Invalid batch header format');
            }
            
            // Find the date pattern in the batch header
            // The date appears after "REG SAL" and before the settlement date
            // Format: YYMMDD (6 digits) followed by another 6-digit date (settlement date)
            // Look for pattern of two consecutive 6-digit numbers
            let dateStr = '';
            
            // Search for the date pattern - two consecutive 6-digit numbers
            // The first one is the effective entry date (YYMMDD)
            const dateMatch = batchHeader.match(/(\d{6})(\d{6})/);
            if (dateMatch) {
                // Take the first 6-digit group (effective entry date)
                dateStr = dateMatch[1];
            } else {
                // Fallback: Try exact position (63-68, which is 0-indexed 62-68)
                if (batchHeader.length >= 68) {
                    dateStr = batchHeader.substring(62, 68);
                    // Validate it's 6 digits
                    if (!/^\d{6}$/.test(dateStr)) {
                        throw new Error('Could not find valid date in batch header');
                    }
                } else {
                    throw new Error('Batch header too short to extract date');
                }
            }
            
            // Parse YYMMDD format
            const year = '20' + dateStr.substring(0, 2);
            const month = dateStr.substring(2, 4);
            const day = dateStr.substring(4, 6);
            const formattedDate = `${month}/${day}/${year}`;

            // CSV header row (data starts from row 2)
            const csvHeader = `New Batch Indicator,ACH Company ID ,ACH Company Name,ACH Payment Type ,Payment Description ,Company Discretionary Data ,Payment Date,Originating Company,Originator Address 1,Originator City ,Originator State ,Originator ZIP Code ,Originator Country ,Recipient Name,Recipient Bank ID ,Recipient Account Number ,Recipient Account Type ,Recipient ID ,Vendor Billing Number,Recipient Address 1,Recipient Address 2,Recipient City ,Recipient State  ,Recipient ZIP Code ,Recipient Country,Recipient Status ,Recipient Transaction Type,Send or Receive,Recipient Amount ,Add Secondary Account,Secondary Bank ID,Secondary Account Number,Secondary Account Type,Payment Allocation Type,Allocation Amount/ Percent,Discretionary Data,Addenda,Trace Number,Include routing and account number in the BPR segment,BPR Originating Company Identifier,Remittance`;

            // Process entry detail records (starting from line 3, lines starting with "6")
            const csvRows = [];
            const clientInfoList = []; // Store client info for display
            let recipientCount = 0;
            
            for (let i = 2; i < lines.length; i++) {
                const line = lines[i];
                
                // Check if it's an entry detail record (starts with "6")
                if (line.length > 0 && line[0] === '6') {
                    // Parse entry detail record
                    // Position 1: Record Type Code (6)
                    // Position 2-3: Transaction Code
                    // Position 4-11: Receiving DFI Identification (8 digits)
                    // Position 12: Check Digit
                    // Position 13-29: DFI Account Number (17 chars, right-justified)
                    // Position 30-39: Amount (10 digits, in cents)
                    // Position 40-54: Individual Identification Number
                    // Position 55-76: Individual Name (22 chars)
                    // Position 77-78: Discretionary Data
                    // Position 79: Addenda Record Indicator
                    // Position 80-94: Trace Number
                    
                    if (line.length < 94) {
                        continue; // Skip invalid lines
                    }

                    // Extract fields
                    const routingNumber = line.substring(3, 12); // positions 4-12 (9 digits including check digit)
                    const accountNumber = line.substring(12, 29).trim(); // positions 13-29, trim spaces
                    const amountCents = parseInt(line.substring(29, 39)); // positions 30-39
                    const amount = parseFloat((amountCents / 100).toFixed(2));
                    const recipientName = line.substring(54, 76).trim(); // positions 55-76
                    const traceNumber = line.substring(79, 94).trim(); // positions 80-94
                    const discretionaryData = line.substring(76, 78); // positions 77-78

                    // Store client info for display
                    clientInfoList.push({
                        clientName: recipientName,
                        amount: amount
                    });

                    // Build CSV row with proper escaping
                    // For recipient rows: A=R, B/C/D/G are cleared (empty)
                    // Column mapping:
                    // A: R (always)
                    // B: Empty (cleared)
                    // C: Empty (cleared)
                    // D: Empty (cleared)
                    // E: ACH (always)
                    // G: Empty (cleared)
                    // N: recipientName - escape properly for long names
                    // O: routingNumber - format as text to preserve leading zeros
                    // P: accountNumber - format as text to preserve leading zeros
                    // Q: Checking (always)
                    // Z: Active (always)
                    // AB: Send (always)
                    // AC: amount
                    // AL: traceNumber - format as text to preserve leading zeros
                    
                    const csvRow = [
                        escapeCSVField('R'),                                    // A: New Batch Indicator
                        escapeCSVField(''),                                    // B: ACH Company ID (cleared)
                        escapeCSVField(''),                                    // C: ACH Company Name (cleared)
                        escapeCSVField(''),                                    // D: ACH Payment Type (cleared)
                        escapeCSVField(''),                                    // E: Payment Description (cleared)
                        escapeCSVField(''),                                    // F: Company Discretionary Data
                        escapeCSVField(''),                                    // G: Payment Date (cleared)
                        escapeCSVField(''),                                    // H: Originating Company
                        escapeCSVField(''),                                    // I: Originator Address 1
                        escapeCSVField(''),                                    // J: Originator City
                        escapeCSVField(''),                                    // K: Originator State
                        escapeCSVField(''),                                    // L: Originator ZIP Code
                        escapeCSVField(''),                                    // M: Originator Country
                        escapeCSVField(recipientName),                         // N: Recipient Name (properly escaped)
                        escapeCSVField(routingNumber, true),                   // O: Recipient Bank ID (text format to preserve leading zeros)
                        escapeCSVField(accountNumber, true),                   // P: Recipient Account Number (text format to preserve leading zeros)
                        escapeCSVField('Checking'),                            // Q: Recipient Account Type
                        escapeCSVField(''),                                    // R: Recipient ID
                        escapeCSVField(''),                                    // S: Vendor Billing Number
                        escapeCSVField(''),                                    // T: Recipient Address 1
                        escapeCSVField(''),                                    // U: Recipient Address 2
                        escapeCSVField(''),                                    // V: Recipient City
                        escapeCSVField(''),                                    // W: Recipient State
                        escapeCSVField(''),                                    // X: Recipient ZIP Code
                        escapeCSVField(''),                                    // Y: Recipient Country
                        escapeCSVField('Active'),                              // Z: Recipient Status
                        escapeCSVField(''),                                    // AA: Recipient Transaction Type
                        escapeCSVField('Send'),                                // AB: Send or Receive
                        escapeCSVField(amount),                                // AC: Recipient Amount
                        escapeCSVField('No'),                                  // AD: Add Secondary Account
                        escapeCSVField(''),                                    // AE: Secondary Bank ID
                        escapeCSVField(''),                                    // AF: Secondary Account Number
                        escapeCSVField(''),                                    // AG: Secondary Account Type
                        escapeCSVField(''),                                    // AH: Payment Allocation Type
                        escapeCSVField(''),                                    // AI: Allocation Amount/Percent
                        escapeCSVField(discretionaryData),                      // AJ: Discretionary Data
                        escapeCSVField(''),                                    // AK: Addenda
                        escapeCSVField(traceNumber, true),                     // AL: Trace Number (text format to preserve leading zeros)
                        escapeCSVField(''),                                    // AM: Include routing and account number in BPR
                        escapeCSVField(''),                                    // AN: BPR Originating Company Identifier
                        escapeCSVField('')                                     // AO: Remittance
                    ];

                    csvRows.push(csvRow.join(','));
                    recipientCount++;
                }
            }

            if (csvRows.length === 0) {
                throw new Error('No valid entry detail records found in file');
            }

            // Create batch row (B) as row 2
            const batchRow = [
                escapeCSVField('B'),                                    // A: New Batch Indicator
                escapeCSVField('1466324632'),                           // B: ACH Company ID (no tab needed, no leading zeros)
                escapeCSVField('TRU FUNDING LLC'),                     // C: ACH Company Name
                escapeCSVField('CCD'),                                 // D: ACH Payment Type
                escapeCSVField(`${recipientCount} rec`),               // E: Payment Description (count)
                escapeCSVField(''),                                    // F: Company Discretionary Data
                escapeCSVField(formattedDate),                         // G: Payment Date
                escapeCSVField(''),                                    // H: Originating Company
                escapeCSVField(''),                                    // I: Originator Address 1
                escapeCSVField(''),                                    // J: Originator City
                escapeCSVField(''),                                    // K: Originator State
                escapeCSVField(''),                                    // L: Originator ZIP Code
                escapeCSVField(''),                                    // M: Originator Country
                escapeCSVField(''),                                    // N: Recipient Name
                escapeCSVField(''),                                    // O: Recipient Bank ID
                escapeCSVField(''),                                    // P: Recipient Account Number
                escapeCSVField(''),                                    // Q: Recipient Account Type
                escapeCSVField(''),                                    // R: Recipient ID
                escapeCSVField(''),                                    // S: Vendor Billing Number
                escapeCSVField(''),                                    // T: Recipient Address 1
                escapeCSVField(''),                                    // U: Recipient Address 2
                escapeCSVField(''),                                    // V: Recipient City
                escapeCSVField(''),                                    // W: Recipient State
                escapeCSVField(''),                                    // X: Recipient ZIP Code
                escapeCSVField(''),                                    // Y: Recipient Country
                escapeCSVField(''),                                    // Z: Recipient Status
                escapeCSVField(''),                                    // AA: Recipient Transaction Type
                escapeCSVField(''),                                    // AB: Send or Receive
                escapeCSVField(''),                                    // AC: Recipient Amount
                escapeCSVField(''),                                    // AD: Add Secondary Account
                escapeCSVField(''),                                    // AE: Secondary Bank ID
                escapeCSVField(''),                                    // AF: Secondary Account Number
                escapeCSVField(''),                                    // AG: Secondary Account Type
                escapeCSVField(''),                                    // AH: Payment Allocation Type
                escapeCSVField(''),                                    // AI: Allocation Amount/Percent
                escapeCSVField(''),                                    // AJ: Discretionary Data
                escapeCSVField(''),                                    // AK: Addenda
                escapeCSVField(''),                                    // AL: Trace Number
                escapeCSVField(''),                                    // AM: Include routing and account number in BPR
                escapeCSVField(''),                                    // AN: BPR Originating Company Identifier
                escapeCSVField('')                                     // AO: Remittance
            ];

            const csvContent = csvHeader + '\n' + batchRow.join(',') + '\n' + csvRows.join('\n');
            
            // Return both CSV content and client info
            return {
                csv: csvContent,
                clientInfo: clientInfoList
            };
        }

        // Format number with commas
        function formatNumberWithCommas(num) {
            const parts = num.toString().split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            return parts.join('.');
        }

        // Simple CSV parser that handles quoted fields
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                
                if (char === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        // Escaped quote
                        current += '"';
                        i++; // Skip next quote
                    } else {
                        // Toggle quote state
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    // End of field
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            
            // Add last field
            result.push(current.trim());
            return result;
        }

        // Load and parse Notification.csv
        async function loadNotificationCSV() {
            // Try to fetch Notification.csv from server
            try {
                console.log('Attempting to load Notification.csv from server...');
                const response = await fetch('Notification.csv');
                console.log('Fetch response status:', response.status, response.statusText);
                console.log('Fetch response ok:', response.ok);
                
                if (!response.ok) {
                    throw new Error(`Failed to load Notification.csv: ${response.status} ${response.statusText}`);
                }
                
                const text = await response.text();
                console.log('Notification.csv loaded from server, text length:', text.length);
                return parseNotificationCSV(text);
            } catch (error) {
                console.error('❌ ERROR loading Notification.csv:', error);
                console.error('Error name:', error.name);
                console.error('Error message:', error.message);
                
                // If it's a CORS or network error, provide helpful message
                if (error.message.includes('Failed to fetch') || error.name === 'TypeError') {
                    console.error('⚠️ This might be a CORS issue. Run a local web server to load Notification.csv automatically.');
                }
                
                // Return empty map but with a default email as fallback
                return { 
                    notificationMap: new Map(), 
                    defaultEmails: ['p.kositc@trufunding.net'] // Fallback default email
                };

        }

        // Parse Notification.csv content
        function parseNotificationCSV(text) {
            try {
                console.log('Notification.csv content (first 500 chars):', text.substring(0, 500));
                
                const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
                console.log('Notification.csv lines after split:', lines.length);
                console.log('Notification.csv lines:', lines);
                
                if (lines.length < 2) {
                    throw new Error(`Notification.csv must have at least 2 lines (header + default), but found ${lines.length} lines`);
                }

                // Parse data rows
                const notificationMap = new Map();
                let defaultEmails = [];
                
                for (let i = 1; i < lines.length; i++) {
                    const row = parseCSVLine(lines[i]);
                    const beneficiaryName = (row[0] || '').trim(); // Column A
                    
                    console.log(`Parsing Notification.csv row ${i}: beneficiaryName = "${beneficiaryName}"`);
                    
                    // Extract emails from columns B, C, D, E, F (indices 1-5)
                    const emails = [];
                    for (let j = 1; j <= 5 && j < row.length; j++) {
                        const email = (row[j] || '').trim();
                        if (email !== '') {
                            emails.push(email);
                        }
                    }
                    
                    console.log(`Row ${i} emails:`, emails);
                    
                    if (beneficiaryName.toUpperCase() === 'DEFAULT') {
                        // Store default emails (row 2, which is index 1)
                        defaultEmails = emails;
                        console.log('Loaded default emails:', defaultEmails);
                    } else if (beneficiaryName !== '') {
                        // Store emails for this beneficiary (case-insensitive key, trimmed and normalized)
                        // Normalize: uppercase, trim, and remove any special characters that might cause issues
                        const normalizedKey = beneficiaryName.toUpperCase().trim().replace(/\s+/g, ' ');
                        notificationMap.set(normalizedKey, emails);
                        console.log(`Loaded emails for "${beneficiaryName}" (key: "${normalizedKey}"):`, emails);
                        console.log(`Map now has ${notificationMap.size} entries`);
                    }
                }
                
                console.log('Loaded notification map with', notificationMap.size, 'entries');
                console.log('Default emails:', defaultEmails);
                
                return { notificationMap, defaultEmails };
            } catch (error) {
                console.error('❌ ERROR parsing Notification.csv:', error);
                console.error('Error name:', error.name);
                console.error('Error message:', error.message);
                
                // Return empty map but with a default email as fallback
                return { 
                    notificationMap: new Map(), 
                    defaultEmails: ['p.kositc@trufunding.net'] // Fallback default email
                };
            }
        }

        // Get emails for a beneficiary name
        function getBeneficiaryEmails(beneficiaryName, notificationMap, defaultEmails) {
            // Normalize the name: trim whitespace, convert to uppercase, and normalize spaces
            const normalizedName = beneficiaryName ? beneficiaryName.trim().toUpperCase().replace(/\s+/g, ' ') : '';
            
            console.log(`Looking up emails for: "${beneficiaryName}" (normalized: "${normalizedName}")`);
            console.log(`Notification map has ${notificationMap.size} entries`);
            console.log(`Map keys:`, Array.from(notificationMap.keys()));
            
            // Try to find exact match first
            let emails = notificationMap.get(normalizedName);
            
            if (emails !== undefined && emails !== null && emails.length > 0) {
                console.log(`✓ Found exact match for "${beneficiaryName}":`, emails);
            } else {
                console.log(`✗ No exact match found for "${normalizedName}"`);
                console.log(`  Checking if key exists in map...`);
                
                // Debug: Check if the key exists with different variations
                const allKeys = Array.from(notificationMap.keys());
                console.log(`  All keys in map:`, allKeys);
                console.log(`  Looking for: "${normalizedName}"`);
                
                // Try direct lookup first
                if (notificationMap.has(normalizedName)) {
                    emails = notificationMap.get(normalizedName);
                    console.log(`  Key exists! Emails:`, emails);
                }
                
                // If still no match, try to find match by removing all spaces
                if (!emails || emails.length === 0) {
                    const nameNoSpaces = normalizedName.replace(/\s+/g, '');
                    console.log(`  Trying space-normalized match (no spaces: "${nameNoSpaces}")...`);
                    for (const [key, value] of notificationMap.entries()) {
                        const keyNoSpaces = key.replace(/\s+/g, '');
                        if (nameNoSpaces === keyNoSpaces && value && value.length > 0) {
                            emails = value;
                            console.log(`✓ Found space-normalized match: "${key}" for "${beneficiaryName}":`, emails);
                            break;
                        }
                    }
                }
            }
            
            // If still no match, use default emails
            if (!emails || emails.length === 0) {
                emails = defaultEmails && defaultEmails.length > 0 ? defaultEmails : ['p.kositc@trufunding.net'];
                console.log(`Using default emails for: "${beneficiaryName}":`, emails);
            } else {
                console.log(`Found emails for "${beneficiaryName}":`, emails);
            }
            
            // Ensure we have at least one email (use fallback if needed)
            if (!emails || emails.length === 0) {
                emails = ['p.kositc@trufunding.net'];
                console.log(`Using fallback email for: "${beneficiaryName}"`);
            }
            
            // Return array of 5 emails (pad with empty strings if needed)
            const result = [...emails];
            while (result.length < 5) {
                result.push('');
            }
            console.log(`Final email array for "${beneficiaryName}":`, result);
            return result.slice(0, 5); // Ensure exactly 5 emails
        }
